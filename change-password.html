<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankease - Change Password</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <div class="app auth-page">
        <div class="auth-container">
            <a class="logo-wrapper auth-logo" href="settings.html" aria-label="Back to settings">
                <img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon">
                <div>
                    <div class="logo-text">Bankease</div>
                    <div class="logo-tagline">ONE CARD. ALL BANKS.</div>
                </div>
            </a>
            <h2 class="auth-heading">Change Password</h2>
            <p class="auth-subtitle">Choose a new password for your Bankease account.</p>
            <form id="changePasswordForm">
                <label for="currentPassword">Current Password</label>
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
                <label for="newPassword">New Password</label>
                <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required />
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
                <p class="form-message" role="alert"></p>
                <button type="submit" class="btn-primary auth-submit">Update Password</button>
            </form>
            <p class="auth-footer"><a href="settings.html">Back to Settings</a></p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
