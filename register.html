<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankease â€“ Register</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <div class="app auth-page">
        <div class="auth-container">
            <a class="logo-wrapper auth-logo" href="dashboard.html" aria-label="Go to dashboard">
                <img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon">
                <div>
                    <div class="logo-text">BANKE<span class="highlight">ASE</span></div>
                    <div class="logo-tagline">ONE CARD. ALL BANKS.</div>
                </div>
            </a>
            <h2 class="auth-heading">Create Account</h2>
            <p class="auth-subtitle">Start managing all your banks with one card
            </p>
            <form id="registerForm">
                <label for="registerFullName">Full Name</label>
                <input id="registerFullName" name="fullName" type="text" placeholder="Name" autocomplete="name" required />
                <label for="registerEmail">Email</label>
                <input id="registerEmail" name="email" type="email" placeholder="you@email.com" autocomplete="email" required />
                <label for="registerPhone">Phone Number</label>
                <input id="registerPhone" name="phone" type="tel" placeholder="082 123 4567" autocomplete="tel" required />
                <label for="registerPassword">Password</label>
                <input id="registerPassword" name="password" type="password" placeholder="" autocomplete="new-password" required />
                <label for="registerConfirmPassword">Confirm Password</label>
                <input id="registerConfirmPassword" name="confirmPassword" type="password" placeholder="" autocomplete="new-password" required />
                <p class="form-message" role="alert"></p>
                <button type="submit" class="btn-primary auth-submit">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
