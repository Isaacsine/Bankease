<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankease – Accounts</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <div class="app">
        <!-- HEADER -->
        <div class="header">
            <a class="logo-wrapper" href="dashboard.html" aria-label="Go to dashboard">
                <img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon">
                <div>
                    <div class="logo-text">Bankease</div>
                    <div class="logo-tagline">ONE CARD. ALL BANKS.</div>
                </div>
            </a>
            <div class="header-actions"><a href="notifications.html" aria-label="View notifications"><i class="fas fa-bell"></i></a><a href="settings.html" aria-label="Open settings"><i class="fas fa-cog"></i></a></div>
        </div>

        <div class="page-title-block">
            <h2>Your Accounts</h2>
            <p>All your linked bank accounts in one place.</p>
        </div>

        <div class="account-page-content">
            <div class="balance-card account-balance-card">
                <div class="balance-label">TOTAL BALANCE</div>
                <div class="balance-amount">R12,450.00</div>
                <div class="balance-sub">Across 3 accounts</div>
            </div>

            <div class="account-summary-list">
                <div class="account-summary-row">
                    <div><strong>FNB</strong>
                        <div class="account-summary-meta">•••• 4589</div>
                    </div>
                    <div class="account-summary-amount"><strong>R8,250.00</strong>
                        <div class="account-summary-meta">Cheque Account</div>
                    </div>
                </div>
                <div class="account-summary-row">
                    <div><strong>Capitec</strong>
                        <div class="account-summary-meta">•••• 1234</div>
                    </div>
                    <div class="account-summary-amount"><strong>R3,200.00</strong>
                        <div class="account-summary-meta">Savings</div>
                    </div>
                </div>
                <div class="account-summary-row">
                    <div><strong>Absa</strong>
                        <div class="account-summary-meta">•••• 7890</div>
                    </div>
                    <div class="account-summary-amount"><strong>R1,000.00</strong>
                        <div class="account-summary-meta">Credit Card</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <button class="nav-item" data-route="dashboard.html"><i class="fas fa-th"></i> Dashboard</button>
            <button class="nav-item active" data-route="accounts.html"><i class="fas fa-wallet"></i> Accounts</button>
            <button class="nav-item" data-route="transfer.html"><i class="fas fa-exchange-alt"></i> Transact</button>
            <button class="nav-item" data-route="settings.html"><i class="fas fa-user-cog"></i> Settings</button>
        </div>
        <div class="bottom-space"></div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script>
        document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => {
            window.location.href = button.dataset.route;
        }));
    </script>
</body>

</html>
