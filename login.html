<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankease â€“ Login</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <div class="app auth-page">
        <div class="auth-container">
            <a class="logo-wrapper auth-logo" href="dashboard.html" aria-label="Go to dashboard">
                <img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon">
                <div>
                    <div class="logo-text">BANKE<span class="highlight">ASE</span></div>
                    <div class="logo-tagline">ONE CARD. ALL BANKS.</div>
                </div>
            </a>
            <h2 class="auth-heading">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to manage all your banks</p>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" placeholder="you@email.com" autocomplete="email" required />
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" placeholder="" autocomplete="current-password" required />
                <p class="form-message" role="alert"></p>
                <button type="submit" class="btn-primary auth-submit">Sign In</button>
            </form>
            <p class="auth-footer"><a href="forgot-password.html">Forgot your password?</a></p>
            <p class="auth-footer">Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
