<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bankease - Reset Password</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <div class="app auth-page">
        <div class="auth-container">
            <a class="logo-wrapper auth-logo" href="login.html" aria-label="Back to sign in">
                <img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon">
                <div>
                    <div class="logo-text">BANKE<span class="highlight">ASE</span></div>
                    <div class="logo-tagline">ONE CARD. ALL BANKS.</div>
                </div>
            </a>
            <h2 class="auth-heading">Set New Password</h2>
            <p class="auth-subtitle">Create a new password to secure your account.</p>
            <form id="resetPasswordForm">
                <input id="resetToken" name="token" type="hidden" />
                <label for="resetNewPassword">New Password</label>
                <input id="resetNewPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required />
                <label for="resetConfirmPassword">Confirm New Password</label>
                <input id="resetConfirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
                <p class="form-message" role="alert"></p>
                <button type="submit" class="btn-primary auth-submit">Reset Password</button>
            </form>
            <p class="auth-footer"><a href="login.html">Back to Sign In</a></p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
