<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankease - Transfer</title>
    <link rel="icon" type="image/png" href="assets/iconLogo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <a class="logo-wrapper" href="dashboard.html" aria-label="Go to dashboard"><img class="logo-icon" src="assets/bankeaseLogo.png" alt="Bankease icon"><div><div class="logo-text">BANKE<span class="highlight">ASE</span></div><div class="logo-tagline">ONE CARD. ALL BANKS.</div></div></a>
            <div class="header-actions"><a href="dashboard.html" aria-label="Back to dashboard"><i class="fas fa-arrow-left"></i></a></div>
        </div>
        <div class="page-title-block"><h2>Transfer Money</h2><p>Move money between linked accounts or record a payment to a beneficiary.</p></div>
        <main class="content-shell">
            <form id="transferForm" class="settings-panel">
                <label for="fromBank">From bank</label>
                <select id="fromBank" required></select>
                <label for="recipientType">Send to</label>
                <select id="recipientType">
                    <option value="account">My linked account</option>
                    <option value="beneficiary">Beneficiary</option>
                </select>
                <div id="accountDestination">
                    <label for="toBank">To bank</label>
                    <select id="toBank" required></select>
                </div>
                <div id="beneficiaryDestination" hidden>
                    <label for="beneficiary">Beneficiary</label>
                    <select id="beneficiary"></select>
                    <a href="beneficiaries.html">Manage beneficiaries</a>
                </div>
                <label for="transferAmount">Amount (R)</label>
                <input id="transferAmount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
                <div id="transferNoteField" hidden>
                    <label for="transferNote">Payment note <span>(optional)</span></label>
                    <textarea id="transferNote" maxlength="240" rows="3" placeholder="e.g. Lending money to my friend"></textarea>
                </div>
                <p class="transfer-disclosure" id="transferDisclosure" hidden>Beneficiary sends are recorded in your Bankease ledger and do not send funds through a bank or payment network.</p>
                <button class="btn-primary full-width-btn" type="submit"><i class="fas fa-exchange-alt"></i> Transfer</button>
                <p id="transferMessage" class="form-message" role="alert"></p>
            </form>
        </main>
        <div class="bottom-nav">
            <button class="nav-item" data-route="dashboard.html"><i class="fas fa-th"></i> Dashboard</button>
            <button class="nav-item" data-route="accounts.html"><i class="fas fa-wallet"></i> Accounts</button>
            <button class="nav-item active"><i class="fas fa-exchange-alt"></i> Transfer</button>
            <button class="nav-item" data-route="settings.html"><i class="fas fa-user-cog"></i> Settings</button>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script>
        const fromBank = document.getElementById('fromBank');
        const toBank = document.getElementById('toBank');
        const beneficiary = document.getElementById('beneficiary');
        const recipientType = document.getElementById('recipientType');
        const message = document.getElementById('transferMessage');
        const form = document.getElementById('transferForm');
        const accountDestination = document.getElementById('accountDestination');
        const beneficiaryDestination = document.getElementById('beneficiaryDestination');
        const transferNoteField = document.getElementById('transferNoteField');
        const transferDisclosure = document.getElementById('transferDisclosure');
        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'form-message ' + type;
        }

        async function loadBanks() {
            const response = await fetch('/api/banks', { credentials: 'same-origin' });
            if (!response.ok) throw new Error('Could not load bank accounts.');
            const result = await response.json();
            const activeBanks = result.banks.filter(bank => bank.is_active !== false);
            const options = activeBanks.map(bank => `<option value="${escapeHtml(bank.id)}">${escapeHtml(bank.custom_name || bank.name)} (R${Number(bank.balance).toFixed(2)})</option>`).join('');
            fromBank.innerHTML = options;
            toBank.innerHTML = options;
            fromBank.disabled = activeBanks.length === 0;
            toBank.disabled = activeBanks.length === 0;
            if (!activeBanks.length) showMessage('No active accounts are available for transfers.', 'error');
            if (toBank.options.length > 1) toBank.selectedIndex = 1;
            const requestedSource = new URLSearchParams(window.location.search).get('bank');
            if (requestedSource && activeBanks.some(bank => bank.id === requestedSource)) fromBank.value = requestedSource;
            const requestedDestination = new URLSearchParams(window.location.search).get('to');
            if (requestedDestination && activeBanks.some(bank => bank.id === requestedDestination)) toBank.value = requestedDestination;
        }

        async function loadBeneficiaries() {
            const response = await fetch('/api/beneficiaries', { credentials: 'same-origin' });
            if (!response.ok) throw new Error('Could not load beneficiaries.');
            const result = await response.json();
            beneficiary.innerHTML = result.beneficiaries.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)} - ${escapeHtml(item.bank_name)} **** ${escapeHtml(item.account_last_digits)}</option>`).join('');
            if (!result.beneficiaries.length) beneficiary.innerHTML = '<option value="">Add a beneficiary first</option>';
        }

        recipientType.addEventListener('change', () => {
            const sendsToBeneficiary = recipientType.value === 'beneficiary';
            accountDestination.hidden = sendsToBeneficiary;
            beneficiaryDestination.hidden = !sendsToBeneficiary;
            toBank.required = !sendsToBeneficiary;
            beneficiary.required = sendsToBeneficiary;
            transferNoteField.hidden = !sendsToBeneficiary;
            transferDisclosure.hidden = !sendsToBeneficiary;
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const submit = form.querySelector('button[type="submit"]');
            submit.disabled = true;
            showMessage('Processing transfer...', '');
            try {
                const sendsToBeneficiary = recipientType.value === 'beneficiary';
                if (!fromBank.value || (sendsToBeneficiary ? !beneficiary.value : !toBank.value)) throw new Error('Choose a source and destination account.');
                const response = await fetch(sendsToBeneficiary ? '/api/beneficiary-transfers' : '/api/transfers', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sendsToBeneficiary
                        ? { fromId: fromBank.value, beneficiaryId: beneficiary.value, amount: Number(document.getElementById('transferAmount').value), note: document.getElementById('transferNote').value }
                        : { fromId: fromBank.value, toId: toBank.value, amount: Number(document.getElementById('transferAmount').value) })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Transfer failed.');
                showMessage(sendsToBeneficiary ? 'Transfer recorded in your activity.' : 'Transfer completed successfully.', 'success');
                await loadBanks();
                if (sendsToBeneficiary) document.getElementById('transferNote').value = '';
                form.reset();
                recipientType.dispatchEvent(new Event('change'));
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                submit.disabled = false;
            }
        });

        document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => {
            window.location.href = button.dataset.route;
        }));
        Promise.all([loadBanks(), loadBeneficiaries()]).catch(error => showMessage(error.message, 'error'));
    </script>
    <style>
        .transfer-disclosure { margin: 12px 0; padding: 10px 12px; border-left: 3px solid #d08a33; background: #fff8ed; color: #60451f; font-size: 12px; line-height: 1.5; }
        #transferForm textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd2d8; border-radius: 5px; font: inherit; resize: vertical; }
        #transferForm [hidden] { display: none; }
    </style>
</body>
</html>
