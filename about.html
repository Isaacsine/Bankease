ther in one place.</p></div></div><section class="info-card"><h3>Bankease SmartCard</h3><p>Bankease helps you manage linked bank accounts, transfers, spending activity, and financial insights from one app.</p><h3>Version</h3><p>2.4.1</p><h3>Contact</h3><p><a href="mailto:support@bankees.co.za">support@bankees.co.za</a></p></section></main><div class="bottom-nav"><button class="nav-item" onclick="location.href='dashboard.html'"><i class="fas fa-th"></i> Dashboard</button><button class="nav-item" onclick="location.href='accounts.html'"><i class="fas fa-wallet"></i> Accounts</button><button class="nav-item" onclick="location.href='analytics.html'"><i class="fas fa-chart-pie"></i> Analytics</button><button class="nav-item" onclick="location.href='settings.html'"><i class="fas fa-user-cog"></i> Settings</button></div></div><script src="theme.js"></script></body></html>
